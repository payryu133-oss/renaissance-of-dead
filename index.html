<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENAISSANCE OF DEAD — REGISTER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0c10;
            --panel-bg: rgba(18, 22, 31, 0.85);
            --border-color: rgba(255, 107, 0, 0.4);
            --text-main: #e2e8f0;
            --orange-glow: #ff6b00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 107, 0, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(255, 42, 95, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Kanit', 'Chakra Petch', sans-serif;
            line-height: 1.6;
            padding: 40px 12px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container { 
            width: 100%; 
            max-width: 480px;
            margin: 0 auto; 
            position: relative;
        }

        /* หอคอยฟักทองซ้อน 3 ชั้น (มุมซ้ายล่าง) */
        .deco-pumpkin-stack {
            position: absolute;
            bottom: -20px;
            left: -15px;
            width: 75px;
            height: 110px;
            z-index: 10;
            transform: rotate(-8deg);
            filter: drop-shadow(0 0 8px rgba(255, 107, 0, 0.6));
            animation: floatSlow 4s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatSlow {
            0% { transform: translateY(0) rotate(-6deg); }
            100% { transform: translateY(-8px) rotate(-2deg); }
        }

        .hero-banner {
            background: rgba(15, 17, 23, 0.92);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 35px 20px 30px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.2);
            z-index: 1;
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            border-radius: 18px 18px 0 0;
            background: linear-gradient(90deg, transparent, var(--orange-glow), #a855f7, transparent);
        }

        .hero-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1.65rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 12px rgba(255, 107, 0, 0.7);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .hero-subtitle {
            font-size: 0.85rem;
            color: var(--orange-glow);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* ปุ่มลิงก์ลงทะเบียน */
        .register-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, var(--orange-glow), #d97706);
            color: #fff;
            text-decoration: none;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.4);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .register-btn:active {
            transform: scale(0.97);
            box-shadow: 0 0 10px rgba(255, 107, 0, 0.7);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ฟักทอง 3 ชั้น (มุมซ้ายล่าง) -->
    <svg class="deco-pumpkin-stack" viewBox="0 0 100 150">
        <path d="M 20,100 C 10,100 10,140 50,140 C 90,140 90,100 80,100 C 95,120 50,145 20,100 Z" fill="#ea580c" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
        <ellipse cx="50" cy="118" rx="35" ry="22" fill="#f97316" stroke="#000" stroke-width="3"/>
        <polygon points="35,110 45,115 32,120" fill="#fef08a" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="65,110 55,115 68,120" fill="#fef08a" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="50,122 42,130 58,130" fill="#fef08a" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/>
        
        <ellipse cx="50" cy="78" rx="32" ry="20" fill="#f97316" stroke="#000" stroke-width="3"/>
        <polygon points="36,72 46,76 33,82" fill="#fef08a" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="64,72 54,76 67,82" fill="#fef08a" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/>
        
        <path d="M 46,20 Q 52,10 54,2" stroke="#15803d" stroke-width="5" fill="none" stroke-linecap="round"/>
        <ellipse cx="50" cy="40" rx="28" ry="18" fill="#f97316" stroke="#000" stroke-width="3"/>
        <polygon points="37,36 45,40 35,44" fill="#fef08a" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="63,36 55,40 65,44" fill="#fef08a" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>

    <!-- กรอบแบนเนอร์หลัก -->
    <div class="hero-banner">
        <div class="hero-title">☣ 𝐑𝐄𝐍𝐀𝐈𝐒𝐒𝐀𝐍𝐂𝐄 𝐎𝐅 𝐃𝐄𝐀𝐃 ☣</div>
        <div class="hero-subtitle">「 Registration 」</div>
        
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSenO85a7KhcU_12RvsuGGRk_MYEr5MKYEap4FU2y0yd8g5wcw/viewform?usp=dialog" target="_blank" class="register-btn">
            📝 ลงทะเบียน
        </a>
    </div>

</div>

</body>
</html>
